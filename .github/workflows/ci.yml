name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # setup-uv with a python-version has already made the virtual environment and
      # exported VIRTUAL_ENV; installing --system would hit the runner's own Python,
      # which is externally managed and refuses.
      - name: Install
        run: uv pip install -e ".[dev,s3]"

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest tests -q
