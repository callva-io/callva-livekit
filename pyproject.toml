[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callva-livekit"
dynamic = ["version"]
description = "Drop-in call webhooks and per-call configuration for any LiveKit agent."
readme = "README.md"
requires-python = ">=3.10.0"
license = "Apache-2.0"
authors = [{ name = "CallVA" }]
keywords = ["livekit", "agents", "voice", "telephony", "webhook", "sip"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "livekit-agents>=1.5.7",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/callva-io/callva-livekit"
Source = "https://github.com/callva-io/callva-livekit"

[tool.hatch.version]
path = "callva/livekit/core/version.py"

[tool.hatch.build.targets.wheel]
packages = ["callva"]

[tool.hatch.build.targets.sdist]
include = ["/callva", "/README.md", "/DESIGN.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Broad `except Exception` is deliberate throughout: nothing this package does to report a
# call is worth taking the call down for, so every boundary degrades instead of raising.

[tool.pytest.ini_options]
asyncio_mode = "auto"
